<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
    <rect width="400" height="600" fill="#141416" />
    <rect x="15" y="15" width="370" height="570" fill="none" stroke="#26262a" stroke-width="1.5" />
    <rect x="25" y="25" width="350" height="550" fill="none" stroke="#1f1f23" stroke-width="0.8" />
    
    <!-- Top Crimson Accent -->
    <line x1="40" y1="40" x2="100" y2="40" stroke="#c4122f" stroke-width="2.5" />
    <text x="40" y="65" fill="#71717a" font-family="'Newsreader', Georgia, serif" font-size="12" letter-spacing="2" text-transform="uppercase">FilmCraft Archive</text>
    
    <!-- Center Minimalist Reel Graphic -->
    <g transform="translate(200, 280)">
        <circle r="55" fill="none" stroke="#3f3f46" stroke-width="2" />
        <circle r="18" fill="none" stroke="#c4122f" stroke-width="2" />
        <circle cx="0" cy="-35" r="9" fill="#27272a" stroke="#52525b" stroke-width="1" />
        <circle cx="30" cy="-18" r="9" fill="#27272a" stroke="#52525b" stroke-width="1" />
        <circle cx="30" cy="18" r="9" fill="#27272a" stroke="#52525b" stroke-width="1" />
        <circle cx="0" cy="35" r="9" fill="#27272a" stroke="#52525b" stroke-width="1" />
        <circle cx="-30" cy="18" r="9" fill="#27272a" stroke="#52525b" stroke-width="1" />
        <circle cx="-30" cy="-18" r="9" fill="#27272a" stroke="#52525b" stroke-width="1" />
    </g>
    
    <!-- Bottom Typography -->
    <text x="200" y="400" fill="#d4d4d8" font-family="'Newsreader', Georgia, serif" font-size="18" font-weight="600" text-anchor="middle" letter-spacing="-0.3">Catalogue Feature</text>
    <text x="200" y="425" fill="#71717a" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="2">NO POSTER ARCHIVED</text>
    
    <line x1="160" y1="445" x2="240" y2="445" stroke="#3f3f46" stroke-width="1" />
</svg>